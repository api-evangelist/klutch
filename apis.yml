apis:
- aid: klutch:klutch-public-api
  name: Klutch Public API
  description: 'The Klutch Public API is a GraphQL API for the Klutch programmable
    credit card. It exposes enriched transaction history with filtering, cursor
    pagination and group-by aggregation; user-defined transaction categories; virtual
    and physical card lifecycle (create, activate, edit, lock, unlock, cancel);
    server-side transaction rules (accumulating over a period, accumulating between
    dates, decline-based-on-filter, day of week, time of day); account balance and
    revolving loan limits; ACH card payments and transfer sources; and Mini App panel
    rendering. Authentication is a bearer session token minted from a developer client
    id and secret key, or OAuth 2.1 authorization code with PKCE for user-consented
    agents.'
