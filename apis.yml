aid: klutch
name: Klutch
description: 'Klutch (Klutch Card) is a US consumer fintech that issues an "app-powered"
  programmable credit card — Klutch Credit (unsecured) and Klutch Spend (collateralized
  prepaid) — whose behavior is extended by user-installable Mini Apps. Its public
  GraphQL API lets developers and Mini App builders list and group enriched card
  transactions (including acquirer metadata such as MCC, entry mode, terminal type and
  card-present flags), create and lock virtual cards, author server-side transaction
  rules that accumulate or decline spend by filter, day of week or time of day, read
  balances, initiate ACH card payments, and render Mini App panels back into the Klutch
  mobile experience. Klutch ships a production and a sandbox GraphQL endpoint with
  transaction simulation mutations, OAuth 2.1 with PKCE and dynamic client registration,
  transaction webhooks, a developer CLI, a first-party JavaScript SDK and Mini App
  component library, and a remote MCP server that lets Claude and ChatGPT operate the
  card in natural language.'
